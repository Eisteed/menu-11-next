name: CI

on:
  push:
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nodejs python3
          sudo apt-get install -y qt6-declarative-dev-tools \
            || sudo apt-get install -y qtdeclarative5-dev-tools

      - name: Run checks
        run: bash tests/run.sh
